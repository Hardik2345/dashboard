<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Datum Temporarily Unavailable</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --panel-border: rgba(255, 255, 255, 0.1);
        --text: #f7f7f7;
        --muted: rgba(247, 247, 247, 0.76);
        --teal: #14c8b0;
        --teal-soft: rgba(20, 200, 176, 0.18);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 56px 20px 24px;
        box-sizing: border-box;
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(20, 200, 176, 0.16), transparent 34%),
          radial-gradient(circle at bottom right, rgba(20, 200, 176, 0.1), transparent 28%),
          linear-gradient(180deg, #070707 0%, #030303 100%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        border-radius: 999px;
        filter: blur(80px);
        opacity: 0.55;
        pointer-events: none;
        animation: drift 10s ease-in-out infinite alternate;
      }
      body::before {
        top: 8%;
        left: -8%;
        width: 280px;
        height: 280px;
        background: rgba(20, 200, 176, 0.2);
      }
      body::after {
        right: -6%;
        bottom: 10%;
        width: 240px;
        height: 240px;
        background: rgba(12, 126, 111, 0.22);
        animation-duration: 12s;
      }
      main {
        position: relative;
        width: min(620px, calc(100vw - 40px));
        padding: 36px 32px 34px;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: linear-gradient(
          180deg,
          rgba(28, 28, 28, 0.92) 0%,
          rgba(14, 14, 14, 0.9) 100%
        );
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.48),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        justify-content: center;
        margin-bottom: 28px;
      }
      .brand img {
        display: block;
        width: 164px;
        height: 70px;
        object-fit: cover;
        object-position: top center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(34px, 6vw, 48px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0 0 10px;
        max-width: 48ch;
        font-size: 16px;
        line-height: 1.65;
        color: var(--muted);
      }
      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(26px, -18px, 0);
        }
      }
      @media (max-width: 640px) {
        body {
          padding-top: 32px;
        }
        main {
          padding: 30px 22px 26px;
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="brand-logo-dark.png" alt="Datum" />
      </div>
      <h1>Hang Tight !</h1>
      <p>We're currently deploying an update to improve your experience.</p>
      <p>Datum will be available again shortly. Thank you for your patience.</p>
    </main>
  </body>
</html>
