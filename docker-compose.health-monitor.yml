version: "3.9"

services:
  health-monitor-service:
    container_name: health-monitor-service-main
    build:
      context: ./health-monitor-service
      dockerfile: Dockerfile
    ports:
      - "4015:4015"
    env_file:
      - .env
      - ./health-monitor-service/.env
    environment:
      HEALTH_MONITOR_PORT: 4015
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - saas-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:4015/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  saas-net:
    name: saas-net-main
    driver: bridge
